spring:
  application:
    name: kr.adapterz

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  sql:
    init:
      mode: never

  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-jwt-32chars}
  access-token-exp-seconds: 3600 # 1시간
  refresh-token-exp-seconds: 1209600 # 14일

app:
  upload:
    post-image-dir: uploads/post-images
    profile-image-dir: uploads/profile-images
    post-image-url-prefix: /uploads/post-images
    profile-image-url-prefix: /uploads/profile-images

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
