spring:
  application:
    name: kr.adapterz

  datasource:
    url: jdbc:h2:mem:adapterz;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  sql:
    init:
      mode: always

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

app:
  upload:
    post-image-dir: uploads/post-images
    profile-image-dir: uploads/profile-images
    post-image-url-prefix: /uploads/post-images
    profile-image-url-prefix: /uploads/profile-images
