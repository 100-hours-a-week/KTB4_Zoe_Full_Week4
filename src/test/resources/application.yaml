spring:
  datasource:
    url: jdbc:h2:mem:adapterz;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: never

  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: test-secret-key-for-jwt-at-least-32-characters
  access-token-exp-seconds: 3600
  refresh-token-exp-seconds: 1209600

app:
  upload:
    post-image-dir: build/test-uploads/post-images
    profile-image-dir: build/test-uploads/profile-images
    post-image-url-prefix: /uploads/post-images
    profile-image-url-prefix: /uploads/profile-images
