name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: public.ecr.aws/h7a4s5m6/votle-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run MySQL migration tests
        run: ./gradlew mysqlTest --no-daemon

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: votle-backend:ci

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - test
      - image
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::867169973993:role/votle-github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and publish production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Dispatch backend deployment
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
          EVENT_TYPE: backend_image_published
          COMPONENT: backend
          SOURCE_REPOSITORY: 100-hours-a-week/KTB4_Zoe_Full_Week4
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_DISPATCH_TOKEN:-}" ]]; then
            echo "::error::DEPLOY_DISPATCH_TOKEN is empty"
            exit 1
          fi

          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::IMAGE_SHA must be a lowercase 40-character Git SHA"
            exit 1
          fi

          payload="$(
            jq -n \
              --arg event_type "$EVENT_TYPE" \
              --arg component "$COMPONENT" \
              --arg image_sha "$IMAGE_SHA" \
              --arg source_repository "$SOURCE_REPOSITORY" \
              '{
                event_type: $event_type,
                client_payload: {
                  component: $component,
                  image_sha: $image_sha,
                  source_repository: $source_repository
                }
              }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${DEPLOY_DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.github.com/repos/100-hours-a-week/KTB4_Zoe_Full_Deploy/dispatches"
